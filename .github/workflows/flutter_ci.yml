name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3

      # Версия закреплена той, что требует pubspec.lock (flutter >= 3.44.0).
      #
      # Стояла 3.24.3 — и на ней прогон не мог пройти в принципе: во Flutter
      # 3.24 пакет flutter_localizations жёстко тянет intl 0.19.0, а pubspec
      # просит ^0.20.2, и `flutter pub get` падает на разрешении зависимостей,
      # не дойдя ни до анализа, ни до тестов. Незамеченным это осталось
      # потому, что прогон висит только на main, а работа идёт в develop.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'

      - name: Install dependencies
        run: |
          cd pick_up_recipe
          flutter pub get

      - name: Run build_runner
        run: |
          cd pick_up_recipe
          dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        run: |
          cd pick_up_recipe
          dart format --output=none --set-exit-if-changed .

      - name: Analyze project source
        run: |
          cd pick_up_recipe
          flutter analyze

      - name: Run tests
        run: |
          cd pick_up_recipe
          flutter test
